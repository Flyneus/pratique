<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prix Carburants – les stations les moins chères</title>
<meta name="description" content="Trouvez le carburant le moins cher près de chez vous grâce aux données ouvertes du gouvernement.">
<style>
  :root {
    --bg: #fff8ee;
    --ink: #1d1a3a;
    --card: #ffffff;
    --pink: #ff4d8d;
    --orange: #ff9f1c;
    --teal: #12c2b0;
    --violet: #6c4bff;
    --muted: #6b6788;
    --radius: 20px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
  }
  header {
    background: linear-gradient(135deg, var(--violet), var(--pink) 60%, var(--orange));
    color: #fff;
    padding: 56px 16px 90px;
    text-align: center;
    border-bottom-left-radius: 50% 30px;
    border-bottom-right-radius: 50% 30px;
  }
  header h1 { margin: 0 0 8px; font-size: clamp(2rem, 6vw, 3.2rem); letter-spacing: -1px; }
  header p { margin: 0 auto; max-width: 560px; opacity: .95; font-size: 1.1rem; }
  main { max-width: 900px; margin: -56px auto 40px; padding: 0 16px; }
  .panel {
    background: var(--card);
    border-radius: var(--radius);
    padding: 22px;
    box-shadow: 0 12px 30px rgba(108, 75, 255, .18);
  }
  form { display: grid; gap: 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  input[type=text], #range, select {
    flex: 1 1 200px;
    padding: 14px 16px;
    font-size: 1rem;
    border: 2px solid #e6e1ff;
    border-radius: 14px;
    background: #fff;
    color: var(--ink);
  }
  input:focus, select:focus { outline: none; border-color: var(--violet); }
  button {
    font: inherit;
    font-weight: 700;
    border: 0;
    border-radius: 14px;
    padding: 14px 22px;
    cursor: pointer;
    color: #fff;
    background: var(--violet);
    transition: transform .1s;
  }
  button:hover { transform: translateY(-2px); }
  button.alt { background: var(--teal); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips label {
    cursor: pointer;
    padding: 8px 16px;
    border-radius: 999px;
    background: #f1eeff;
    font-weight: 600;
    border: 2px solid transparent;
  }
  .chips input { position: absolute; opacity: 0; pointer-events: none; }
  .chips input:checked + span { color: #fff; }
  .chips label:has(input:checked) { background: var(--pink); color: #fff; }
  .chips label:has(input:focus-visible) { border-color: var(--ink); }
  #status { margin: 22px 4px 8px; color: var(--muted); font-weight: 600; min-height: 1.5em; }
  #results { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .station {
    display: grid;
    grid-template-columns: 56px 1fr auto;
    gap: 14px;
    align-items: center;
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: 0 4px 14px rgba(29, 26, 58, .08);
    border-left: 8px solid var(--violet);
  }
  .station:nth-child(1) { border-left-color: var(--teal); }
  .station:nth-child(2) { border-left-color: var(--orange); }
  .station:nth-child(3) { border-left-color: var(--pink); }
  .rank {
    width: 56px; height: 56px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 1.3rem; font-weight: 800; color: #fff;
    background: var(--violet);
  }
  .station:nth-child(1) .rank { background: var(--teal); }
  .station:nth-child(2) .rank { background: var(--orange); }
  .station:nth-child(3) .rank { background: var(--pink); }
  .info h3 { margin: 0; font-size: 1.05rem; }
  .info p { margin: 2px 0 0; color: var(--muted); font-size: .92rem; }
  .info a { color: var(--violet); font-weight: 600; text-decoration: none; }
  .info a:hover { text-decoration: underline; }
  .price { text-align: right; }
  .price strong { display: block; font-size: 1.6rem; color: var(--violet); }
  .price small { color: var(--muted); }
  .station.best { border-left-color: var(--orange); box-shadow: 0 0 0 3px var(--orange), 0 8px 22px rgba(255, 159, 28, .35); background: #fffaf0; }
  .badge { display: inline-block; margin-left: 6px; padding: 2px 10px; border-radius: 999px; background: var(--orange); color: #fff; font-size: .75rem; font-weight: 800; vertical-align: middle; }
  .price .total { display: block; color: var(--muted); font-size: .82rem; }
  #note { margin: 4px 4px 14px; color: var(--muted); font-size: .85rem; }
  [hidden] { display: none !important; }
  .modes { display: flex; gap: 8px; flex-wrap: wrap; }
  .mode { background: #f1eeff; color: var(--ink); }
  .mode.on { background: var(--violet); color: #fff; }
  .conso { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .conso input { width: 90px; padding: 14px 12px; font-size: 1rem; border: 2px solid #e6e1ff; border-radius: 14px; }
  footer { text-align: center; padding: 0 16px 40px; color: var(--muted); font-size: .9rem; }
  footer a { color: var(--violet); }
  @media (max-width: 520px) {
    .station { grid-template-columns: 44px 1fr; }
    .rank { width: 44px; height: 44px; font-size: 1.05rem; }
    .price { grid-column: 1 / -1; text-align: left; }
  }
</style>
</head>
<body>
<header>
  <h1>⛽ Prix Carburants</h1>
  <p>Trouvez la station la moins chère près de chez vous, en temps quasi réel.</p>
</header>

<main>
  <div class="panel">
    <form id="form">
      <div class="modes">
        <button type="button" class="mode on" data-mode="place">📍 Autour d'un lieu</button>
        <button type="button" class="mode" data-mode="route">🛣️ Sur un itinéraire</button>
      </div>
      <div class="row" id="rowPlace">
        <input type="text" id="place" value="Quimper" placeholder="Ville ou code postal (ex : Lyon, 33000)" autocomplete="off" aria-label="Ville ou code postal">
        <button type="submit">Rechercher</button>
        <button type="button" class="alt" id="geo">📍 Autour de moi</button>
      </div>
      <div class="row" id="rowRoute" hidden>
        <input type="text" id="from" placeholder="Départ (ex : Quimper)" autocomplete="off" aria-label="Départ">
        <input type="text" id="to" placeholder="Arrivée (ex : Rennes)" autocomplete="off" aria-label="Arrivée">
        <button type="submit">Rechercher</button>
      </div>
      <div class="chips" role="radiogroup" aria-label="Carburant">
        <label><input type="radio" name="fuel" value="gazole"><span>Gazole</span></label>
        <label><input type="radio" name="fuel" value="e10"><span>SP95-E10</span></label>
        <label><input type="radio" name="fuel" value="sp95"><span>SP95</span></label>
        <label><input type="radio" name="fuel" value="sp98"><span>SP98</span></label>
        <label><input type="radio" name="fuel" value="e85" checked><span>E85</span></label>
        <label><input type="radio" name="fuel" value="gplc"><span>GPLc</span></label>
      </div>
      <div class="row" id="rowRadius">
        <select id="radius" aria-label="Rayon de recherche">
          <option value="5">Rayon : 5 km</option>
          <option value="10">Rayon : 10 km</option>
          <option value="20" selected>Rayon : 20 km</option>
          <option value="50">Rayon : 50 km</option>
        </select>
      </div>
      <div class="row" id="rowDetour" hidden>
        <select id="detour" aria-label="Détour maximum">
          <option value="2">Détour max : 2 km</option>
          <option value="5" selected>Détour max : 5 km</option>
          <option value="10">Détour max : 10 km</option>
        </select>
        <input type="number" id="range" placeholder="Autonomie restante (km), facultatif" min="1" step="1" aria-label="Autonomie restante en km">
      </div>
      <label class="conso">Consommation <input type="number" id="conso" value="11.8" min="2" max="40" step="0.1"> L/100 km</label>
    </form>
  </div>

  <div id="status" role="status" aria-live="polite"></div>
  <p id="note" hidden></p>
  <ol id="results"></ol>
</main>

<footer>
  Données : <a href="https://www.data.gouv.fr/fr/datasets/prix-des-carburants-en-france-flux-instantane-v2-amelioree/" target="_blank" rel="noopener">Prix des carburants en France (data.economie.gouv.fr)</a>
  · Géocodage : <a href="https://adresse.data.gouv.fr/" target="_blank" rel="noopener">Base Adresse Nationale</a>.
  Les prix sont indicatifs.
</footer>

<script>
const API = "https://data.economie.gouv.fr/api/explore/v2.1/catalog/datasets/prix-des-carburants-en-france-flux-instantane-v2/records";
const GEO = "https://api-adresse.data.gouv.fr/search/";
const TANK = 40; // litres du plein de référence
const cons = () => Math.max(0, Number($("conso").value) || 0); // L/100 km
const OSRM = "https://router.project-osrm.org/route/v1/driving";
const LABELS = { gazole: "Gazole", e10: "SP95-E10", sp95: "SP95", sp98: "SP98", e85: "E85", gplc: "GPLc" };

const $ = (id) => document.getElementById(id);
const statusEl = $("status");
const resultsEl = $("results");

function setStatus(msg) { statusEl.textContent = msg; }

async function geocode(query) {
  const r = await fetch(`${GEO}?q=${encodeURIComponent(query)}&limit=1`);
  if (!r.ok) throw new Error("Géocodage indisponible");
  const data = await r.json();
  const f = data.features && data.features[0];
  if (!f) throw new Error("Lieu introuvable");
  return { lon: f.geometry.coordinates[0], lat: f.geometry.coordinates[1], label: f.properties.label };
}

async function search(lat, lon, label) {
  const fuel = document.querySelector("input[name=fuel]:checked").value;
  const radius = Number($("radius").value);
  const field = `${fuel}_prix`;
  const where = `within_distance(geom, geom'POINT(${lon} ${lat})', ${radius}km) and ${field} is not null`;
  const url = `${API}?where=${encodeURIComponent(where)}&order_by=${field}&limit=100`;

  setStatus("Recherche en cours…");
  resultsEl.replaceChildren();
  $("note").hidden = true;
  const r = await fetch(url);
  if (!r.ok) throw new Error("L'API des carburants ne répond pas");
  const data = await r.json();
  render(data.results || [], fuel, label, radius, lat, lon);
}

function km(lat1, lon1, lat2, lon2) {
  const r = Math.PI / 180;
  const a = Math.sin((lat2 - lat1) * r / 2) ** 2 +
    Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin((lon2 - lon1) * r / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(a));
}

function render(stations, fuel, label, radius, lat, lon, isRoute) {
  if (!stations.length) {
    setStatus(isRoute
      ? `Aucune station ${LABELS[fuel]} trouvée à moins de ${radius} km de l'itinéraire ${label}.`
      : `Aucune station ${LABELS[fuel]} trouvée dans ${radius} km autour de ${label}.`);
    return;
  }
  // Coût = plein de 40 L + aller-retour jusqu'à la station (à vol d'oiseau)
  stations.forEach((s) => {
    if (!isRoute) s._km = s.geom ? km(lat, lon, s.geom.lat, s.geom.lon) : 0;
    const price = Number(s[`${fuel}_prix`]);
    s._cost = price * (TANK + 2 * s._km * cons() / 100);
  });
  const best = stations.reduce((a, b) => (a._cost <= b._cost ? a : b));
  const shown = stations.slice(0, 30);
  if (!shown.includes(best)) shown.push(best);
  setStatus(isRoute
    ? `${shown.length} stations en ${LABELS[fuel]} sur l'itinéraire ${label}`
    : `${shown.length} stations en ${LABELS[fuel]} autour de ${label}`);
  const note = $("note");
  note.hidden = false;
  note.textContent = `⭐ Meilleur rapport distance/prix : ${best.ville} (${best._km.toFixed(1).replace(".", ",")} km, ${best._cost.toFixed(2).replace(".", ",")} € pour un plein de ${TANK} L, ${isRoute ? "détour aller-retour inclus" : "trajet aller-retour inclus"}). Calcul à vol d'oiseau, consommation de ${String(cons()).replace(".", ",")} L/100 km.`;
  shown.forEach((s) => {
    const i = stations.indexOf(s);
    const li = document.createElement("li");
    li.className = "station" + (s === best ? " best" : "");

    const rank = document.createElement("div");
    rank.className = "rank";
    rank.textContent = i + 1;

    const info = document.createElement("div");
    info.className = "info";
    const h = document.createElement("h3");
    h.textContent = `${s.ville || ""} (${s.cp || ""})`;
    if (s === best) {
      const b = document.createElement("span");
      b.className = "badge";
      b.textContent = "⭐ Meilleur rapport";
      h.appendChild(b);
    }
    const p = document.createElement("p");
    const dist = s._km.toFixed(1).replace(".", ",");
    p.textContent = isRoute
      ? `${s.adresse || ""} · à ${dist} km de la route · km ${Math.round(s._along)} du trajet`
      : `${s.adresse || ""} · ${dist} km`;
    info.append(h, p);
    const g = s.geom || (s.latitude != null ? { lat: s.latitude / 100000, lon: s.longitude / 100000 } : null);
    if (g) {
      const a = document.createElement("a");
      a.href = `https://www.google.com/maps/dir/?api=1&destination=${g.lat},${g.lon}`;
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = "Itinéraire →";
      const p2 = document.createElement("p");
      p2.appendChild(a);
      info.appendChild(p2);
    }

    const price = document.createElement("div");
    price.className = "price";
    const strong = document.createElement("strong");
    strong.textContent = `${Number(s[`${fuel}_prix`]).toFixed(3).replace(".", ",")} €/L`;
    price.appendChild(strong);
    const maj = s[`${fuel}_maj`];
    if (maj) {
      const small = document.createElement("small");
      small.textContent = "Mis à jour le " + new Date(maj).toLocaleDateString("fr-FR");
      price.appendChild(small);
    }
    const total = document.createElement("span");
    total.className = "total";
    total.textContent = `≈ ${s._cost.toFixed(2).replace(".", ",")} € le plein + ${isRoute ? "détour" : "trajet"}`;
    price.appendChild(total);

    li.append(rank, info, price);
    resultsEl.appendChild(li);
  });
}

// Points de l'itinéraire espacés d'au plus 1 km, avec la distance cumulée depuis le départ
function densify(coords) {
  const pts = [{ ...coords[0], along: 0 }];
  let total = 0;
  for (let i = 1; i < coords.length; i++) {
    const a = coords[i - 1], b = coords[i];
    const d = km(a.lat, a.lon, b.lat, b.lon);
    const n = Math.max(1, Math.ceil(d));
    for (let k = 1; k <= n; k++) {
      pts.push({ lat: a.lat + (b.lat - a.lat) * k / n, lon: a.lon + (b.lon - a.lon) * k / n, along: total + d * k / n });
    }
    total += d;
  }
  return pts;
}

async function searchRoute(A, B) {
  const fuel = document.querySelector("input[name=fuel]:checked").value;
  const detour = Number($("detour").value);
  const field = `${fuel}_prix`;

  setStatus("Calcul de l'itinéraire…");
  resultsEl.replaceChildren();
  $("note").hidden = true;
  const r = await fetch(`${OSRM}/${A.lon},${A.lat};${B.lon},${B.lat}?overview=full&geometries=geojson`);
  if (!r.ok) throw new Error("Calcul d'itinéraire indisponible");
  const j = await r.json();
  if (!j.routes || !j.routes[0]) throw new Error("Aucun itinéraire trouvé");
  const pts = densify(j.routes[0].geometry.coordinates.map(([lo, la]) => ({ lat: la, lon: lo })));
  const total = pts[pts.length - 1].along;

  // Points de recherche le long de la route (cercles qui se recouvrent), 80 requêtes maximum
  const step = Math.max(detour * 1.6, total / 80);
  const samples = [];
  let next = 0;
  for (const p of pts) if (p.along >= next) { samples.push(p); next = p.along + step; }
  samples.push(pts[pts.length - 1]);

  setStatus(`Itinéraire de ${Math.round(total)} km : recherche des stations…`);
  const byId = new Map();
  let ok = 0, i = 0;
  async function worker() {
    while (i < samples.length) {
      const p = samples[i++];
      const where = `within_distance(geom, geom'POINT(${p.lon} ${p.lat})', ${detour}km) and ${field} is not null`;
      try {
        const res = await fetch(`${API}?where=${encodeURIComponent(where)}&order_by=${field}&limit=20`);
        if (!res.ok) continue;
        const d = await res.json();
        ok++;
        for (const s of d.results || []) byId.set(s.id, s);
      } catch (e) { /* on continue avec les autres points */ }
    }
  }
  await Promise.all(Array.from({ length: 6 }, worker));
  if (!ok) throw new Error("L'API des carburants ne répond pas");

  const stations = [];
  for (const s of byId.values()) {
    if (!s.geom) continue;
    let min = Infinity, along = 0;
    for (const p of pts) {
      const d = km(s.geom.lat, s.geom.lon, p.lat, p.lon);
      if (d < min) { min = d; along = p.along; }
    }
    if (min <= detour) { s._km = min; s._along = along; stations.push(s); }
  }
  stations.sort((a, b) => a[field] - b[field]);

  // Autonomie restante : on ne garde que les stations atteignables avant la panne sèche
  const range = Number($("range").value);
  let label = `${A.label} → ${B.label}`;
  let list = stations;
  if (range > 0) {
    list = stations.filter((s) => s._along + s._km <= range);
    if (!list.length) {
      const first = stations.reduce((m, s) => Math.min(m, s._along), Infinity);
      setStatus(stations.length
        ? `⚠️ Aucune station atteignable avec ${range} km d'autonomie : la première est à environ ${Math.round(first)} km du départ.`
        : `Aucune station ${LABELS[fuel]} trouvée à moins de ${detour} km de l'itinéraire.`);
      return;
    }
    label += ` (stations atteignables avec ${range} km d'autonomie)`;
  }
  render(list, fuel, label, detour, 0, 0, true);
}

async function run(fn) {
  try { await fn(); }
  catch (e) { setStatus("⚠️ " + e.message); }
}

let mode = "place";
document.querySelectorAll(".mode").forEach((b) => b.addEventListener("click", () => {
  mode = b.dataset.mode;
  document.querySelectorAll(".mode").forEach((x) => x.classList.toggle("on", x === b));
  const route = mode === "route";
  $("rowPlace").hidden = route;
  $("rowRadius").hidden = route;
  $("rowRoute").hidden = !route;
  $("rowDetour").hidden = !route;
}));

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  if (mode === "route") {
    const a = $("from").value.trim(), b = $("to").value.trim();
    if (!a || !b) { setStatus("Saisissez un départ et une arrivée."); return; }
    run(async () => {
      setStatus("Localisation…");
      const [A, B] = await Promise.all([geocode(a), geocode(b)]);
      await searchRoute(A, B);
    });
    return;
  }
  const q = $("place").value.trim();
  if (!q) { setStatus("Saisissez une ville ou un code postal."); return; }
  run(async () => {
    setStatus("Localisation…");
    const p = await geocode(q);
    await search(p.lat, p.lon, p.label);
  });
});

$("geo").addEventListener("click", () => {
  if (!navigator.geolocation) { setStatus("Géolocalisation non disponible."); return; }
  setStatus("Localisation en cours…");
  navigator.geolocation.getCurrentPosition(
    (pos) => run(() => search(pos.coords.latitude, pos.coords.longitude, "votre position")),
    () => setStatus("Impossible d'obtenir votre position."),
    { timeout: 10000 }
  );
});

// Recherche par défaut au chargement
$("form").requestSubmit();
</script>
</body>
</html>
